# The mutation gate (bin/mutate). Every mutant must be killed by a test or
# listed here with the reason no test can catch it.

# Each mutant gets 120 seconds. A surviving mutant runs its whole covering
# set, and for the gate code that set (gate, sweep, revision, check and report
# tests, each building git repositories) takes longer than the 10 second
# default under parallel load. At 10 seconds those survivors would score as
# timeouts, which count as no verdict and hide them.
timeout: 120

# Grouped by source file, one header each: append under your file's header
# and check for an existing entry first. Each entry names its kind:
# equivalent (no test can observe the change), a hang (detected, but
# Mutineer scores it as no verdict), or a Mutineer blind spot (the right
# side of a multi-line `&&` or `||`: Ruby's line coverage records no event on
# a continuation line, and Mutineer selects no tests for an operand that may
# never run; each one was verified by hand).
ignore:

  # === lib/exhale/complexity/ratchet.rb ===
  # Equivalent. Ratchet#shape_matches: dropping the empty-side guard, or
  # weakening it to `&&`. With no head or no base unit there are no
  # candidates, so the greedy pass returns [] either way; the guard only
  # skips normalizing the other side.
  - "974aaf51c4e0"
  - "87815e27fe40"
  # Equivalent. Ratchet#similarity: dropping the size prefilter. Weighted
  # Jaccard never exceeds the smaller total over the larger, so every pair
  # close? turns away scores under 0.80 anyway.
  - "98bbadf329d8"

  # === lib/exhale/contract/markdown.rb ===
  # Equivalent. Markdown.step: the `nil` is the branch's return value, and
  # blocks discards step's return value.
  - "57164af371e0"

  # === lib/exhale/contract/resolver.rb ===
  # Equivalent. Resolver#const_glob_matches: `<` to `<=`. A unit's prefixes are
  # nested (A, A::B, A::B::C), so two prefixes of one unit never have equal
  # length.
  - "68f881844951"
  # Equivalent. Resolver#keeping_clause: dropping the same-unit guard. keeps?
  # needs two different references, and one unit takes exactly one, so it
  # answers nil.
  - "14ce2fc5a482"

  # === lib/exhale/dry/check.rb ===
  # Equivalent. Check#find_base: dropping `return unless @git.repo?`. A --base
  # outside a repository already raised on the line above, and without one every
  # git lookup outside a repository answers nil, so the base is nil either way.
  - "030cd8d6e2b4"
  # Equivalent. Check#write_cache: the rescue's `nil` is a return value nobody
  # reads.
  - "61c3c7a0e600"

  # === lib/exhale/dry/gate.rb ===
  # Equivalent. Gate#verdict and Gate#prefetch_blame: prefetching only warms
  # @blame. Gate#age blames any file the prefetch skipped, with the same rescue
  # to no times, so skipping the prefetch, its queue or its threads changes no
  # verdict.
  - "401adbd4f4dd"
  - "7743ff994e71"
  - "484da3a6d2b6"
  # Equivalent. Gate#cluster: dropping each group's matches only empties the
  # score cache. score_between recomputes every pair with the scorer the matcher
  # used, so every score comes out the same.
  - "882f751c9d5a"
  # Hang. Gate#cluster: `==` to `!=` in the union-find walk loops forever, so
  # every test that builds a finding hangs. Mutineer scores a hang as a timeout,
  # which isn't a kill, so it is listed here.
  - "34f96862c889"
  # Hang. UnionFind#find: the root walk and the compression loop at lines 77
  # and 78, with their conditions flipped, loop forever. Mutineer scores a hang
  # as a timeout, which isn't a kill.
  - "23569a3e9bee"
  - "f192a2f140ce"
  # Equivalent. UnionFind#find: dropping the compression loop. It only
  # repoints keys at their root, so every find answers the same root.
  - "9edff91745ef"
  # Equivalent. Gate#unkept_twins: `&&` to `||` in the whole-unit guard. Both
  # sides of a match are whole or neither is, so the two agree.
  - "a143f42738a3"
  # Equivalent. Gate#unkept_twins: dropping the expanded-pair set. A repeated
  # expansion emits the same twin matches again, and clustering merges
  # duplicate matches into the same finding.
  - "f2bfbbfb87a0"
  # Equivalent. Gate#unkept_twins: dropping the two-singleton skip. A kept edge
  # between two lone units yields only that pair, which the emitted and
  # keeping_clause checks already drop.
  - "a93057ab28c1"
  # Equivalent. Gate#unkept_twins: dropping the emitted check. A twin the
  # matcher already emitted passes the same settings and has the same score,
  # so a duplicate match joins the same finding.
  - "7eea9bd89379"
  # Equivalent. Gate#base_clusters: dropping the identity route. An untouched
  # location has the content it had at the base, so its structural key already
  # leads to the same base cluster.
  - "73d7427b4798"

  # === lib/exhale/dry/index.rb ===
  # Equivalent. Index#shared_weight: `<=` to `<`. With equal sizes the two sets
  # only swap roles, and the weight of their intersection is the same either
  # way.
  - "40976319dcad"

  # === lib/exhale/dry/matcher.rb ===
  # Equivalent. Matcher#run_ordinal: the trailing `count + 1` is unreachable.
