  - "44d27827442b"
  - "8b6a70daeb17"
  - "5e23f8031e3c"
  - "fff72589238b"
  # Equivalent. Matcher#prefix: `>` to `>=` stops one digest early when the
  # taken weight equals the budget exactly. That hides a pair from one entry's
